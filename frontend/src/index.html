<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tempo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Organiza tus horas de trabajo por proyectos">
  <!-- Icono: SVG en navegadores modernos, ICO como respaldo y PNG para iPhone -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
  <script>
    // Aplica el tema guardado antes de que cargue Angular (evita el parpadeo)
    try {
      var t = localStorage.getItem('tempo.theme');
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
